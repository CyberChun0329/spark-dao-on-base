[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [
  { access = "read-write", path = "./teaching_gas_calibration.csv" },
  { access = "read-write", path = "./teaching_class_size_gas_calibration.csv" },
  { access = "read-write", path = "./teaching_fault_size_gas_calibration.csv" },
  { access = "read-write", path = "./teaching_followup_gas_calibration.csv" },
  { access = "read-write", path = "./research_gas_calibration.csv" }
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
multiline_func_header = "attributes_first"
