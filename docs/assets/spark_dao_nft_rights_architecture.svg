<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1160" viewBox="0 0 1660 1160">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 18px Arial, Helvetica, sans-serif; fill: #475569; }
      .zoneTitle { font: 700 22px Arial, Helvetica, sans-serif; letter-spacing: .5px; }
      .moduleTitle { font: 700 22px Arial, Helvetica, sans-serif; letter-spacing: .4px; }
      .moduleSub { font: 400 17px Arial, Helvetica, sans-serif; fill: #475569; }
      .boxTitle { font: 700 21px Arial, Helvetica, sans-serif; fill: #111827; }
      .boxTitleSmall { font: 700 18px Arial, Helvetica, sans-serif; fill: #111827; }
      .body { font: 400 17px Arial, Helvetica, sans-serif; fill: #243244; }
      .small { font: 400 15px Arial, Helvetica, sans-serif; fill: #475569; }
      .micro { font: 400 13px Arial, Helvetica, sans-serif; fill: #64748b; }
      .tag { font: 700 14px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .offZone { fill: #fff7ed; stroke: #c2410c; stroke-width: 3.2; stroke-dasharray: 8 6; }
      .chainZone { fill: #eef2ff; stroke: #334155; stroke-width: 3.2; }
      .teachModule { fill: #eff6ff; stroke: #1d4ed8; stroke-width: 1.8; stroke-opacity: .58; }
      .researchModule { fill: #f0fdf4; stroke: #15803d; stroke-width: 1.8; stroke-opacity: .58; }
      .cardOff { fill: #fffaf0; stroke: #f97316; stroke-width: 1.4; rx: 8; }
      .cardTeach { fill: #ffffff; stroke: #2563eb; stroke-width: 1.5; rx: 8; }
      .cardResearch { fill: #ffffff; stroke: #16a34a; stroke-width: 1.5; rx: 8; }
      .coreTeach { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 2.0; rx: 8; }
      .coreResearch { fill: #dcfce7; stroke: #15803d; stroke-width: 2.0; rx: 8; }
      .frozen { fill: #fffbeb; stroke: #d97706; stroke-width: 1.5; rx: 8; }
      .gate { fill: #eef2ff; stroke: #3730a3; stroke-width: 1.7; rx: 8; }
      .settlement { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2.2; rx: 8; }
      .settlementTitle { font: 700 21px Arial, Helvetica, sans-serif; fill: #111827; }
      .settlementBody { font: 400 17px Arial, Helvetica, sans-serif; fill: #243244; }
      .claim { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 1.6; rx: 8; }
      .arrowDark { fill: none; stroke: #334155; stroke-width: 3.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowDark); }
      .arrowBlue { fill: none; stroke: #2563eb; stroke-width: 3.7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowBlue); }
      .arrowGreen { fill: none; stroke: #16a34a; stroke-width: 3.7; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowGreen); }
      .arrowPurple { fill: none; stroke: #7c3aed; stroke-width: 4.1; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowPurple); }
      .arrowOrange { fill: none; stroke: #ea580c; stroke-width: 3.8; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrowOrange); }
      .legendText { font: 400 16px Arial, Helvetica, sans-serif; fill: #334155; }
      .lock { fill: #1e293b; }
    </style>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowGreenLegend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowPurpleLegend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrowOrangeLegend" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1660" height="1160"/>
  <text class="title" x="44" y="48">Spark DAO teaching and research contribution-rights architecture</text>
  <text class="subtitle" x="44" y="82">How off-chain teaching work is converted into enforceable commitments, settlement outcomes, and research reward rights.</text>

  <g transform="translate(0 32)">

  <!-- Two main frames -->
  <rect class="offZone" x="40" y="92" width="350" height="884" rx="14"/>
  <text class="zoneTitle" x="64" y="128" fill="#9a3412">OFF-CHAIN RESPONSIBILITY</text>

  <rect class="chainZone" x="464" y="92" width="1110" height="884" rx="14"/>
  <text class="zoneTitle" x="490" y="128" fill="#1e293b">ON-CHAIN RECOGNISED-STATE EXECUTION LAYER</text>

  <rect class="teachModule" x="494" y="146" width="1010" height="350" rx="12"/>
  <text class="moduleTitle" x="554" y="178" fill="#1d4ed8">TEACHING NFT</text>
  <text class="moduleSub" x="554" y="204">Class attribution and bounded settlement</text>

  <rect class="researchModule" x="494" y="586" width="1010" height="350" rx="12"/>
  <text class="moduleTitle" x="554" y="618" fill="#15803d">RESEARCH NFT</text>
  <text class="moduleSub" x="554" y="644">Material attribution and use-triggered allocation</text>

  <!-- Off-chain column -->
  <rect class="cardOff" x="65" y="168" width="300" height="126"/>
  <text class="boxTitle" x="88" y="206">Core coordinators</text>
  <text class="body" x="88" y="242">Session configuration</text>
  <text class="body" x="88" y="272">Attribution routing</text>

  <rect class="cardOff" x="65" y="370" width="300" height="126"/>
  <text class="boxTitle" x="88" y="408">Teachers</text>
  <text class="body" x="88" y="444">Class delivery</text>
  <text class="body" x="88" y="474">Settlement outcome</text>

  <rect class="cardOff" x="65" y="572" width="300" height="126"/>
  <text class="boxTitle" x="88" y="610">Researchers</text>
  <text class="body" x="88" y="646">Recognised contributor</text>
  <text class="body" x="88" y="676">Unlocked claim</text>

  <rect class="cardOff" x="65" y="774" width="300" height="126"/>
  <text class="boxTitle" x="88" y="812">Spark DAO collective</text>
  <text class="body" x="88" y="848">Reserve and audit trail</text>
  <text class="body" x="88" y="878">Org-level consequence</text>

  <!-- Teaching module cards -->
  <rect class="coreTeach" x="548" y="252" width="380" height="156"/>
  <text class="boxTitle" x="573" y="284">Teaching attribution</text>
  <text class="body" x="573" y="316">Class parties and scope</text>
  <text class="body" x="573" y="342">Price, pay, research share</text>
  <text class="body" x="573" y="368">Outcome / fault branch</text>
  <text class="body" x="573" y="394">Research-use link</text>

  <rect class="settlement" x="1070" y="252" width="380" height="156"/>
  <text class="settlementTitle" x="1095" y="294">Teaching settlement authority</text>
  <text class="settlementBody" x="1095" y="332">Recognised class state</text>
  <text class="settlementBody" x="1095" y="362">Valid / seat / teacher fault</text>
  <text class="settlementBody" x="1095" y="392">Fixed consequence</text>

  <!-- Research module cards -->
  <rect class="coreResearch" x="548" y="702" width="380" height="156"/>
  <text class="boxTitle" x="573" y="734">Research attribution</text>
  <text class="body" x="573" y="766">Registered material</text>
  <text class="body" x="573" y="792">Current claim holder</text>
  <text class="body" x="573" y="818">Share and decay terms</text>
  <text class="body" x="573" y="844">Teaching-use basis</text>

  <rect class="claim" x="1070" y="702" width="380" height="156"/>
  <text class="boxTitle" x="1095" y="744">Teaching-to-research pool</text>
  <text class="body" x="1095" y="782">Class-triggered allocation</text>
  <text class="body" x="1095" y="812">Claimable state</text>
  <text class="body" x="1095" y="842">Unlock / claim status</text>

  <!-- Intra-teaching arrows -->
  <path class="arrowBlue" d="M928 304 L1070 304"/>

  <!-- Research module arrows -->

  <!-- Off-chain to on-chain arrows -->
  <path class="arrowOrange" d="M365 231 C455 231,474 291,548 291"/>

  <path class="arrowOrange" d="M365 412 C455 412,474 330,548 330"/>

  <path class="arrowOrange" d="M365 656 C455 656,474 806,548 806"/>

  <path class="arrowPurple" d="M1260 408 C1260 520,1260 590,1260 702"/>

  <!-- On-chain to off-chain consequence arrows routed around bottom -->
  <path class="arrowPurple" d="M1070 356 L1000 356 L1000 454 L365 454"/>

  <path class="arrowPurple" d="M1450 330 L1624 330 L1624 956 L430 956 L430 837 L365 837"/>

  <path class="arrowPurple" d="M1450 780 L1539 780 L1539 541 L430 541 L430 614 L365 614"/>

  <path class="arrowGreen" d="M548 754 L520 754 L520 369 L548 369"/>

  <!-- Lock indicators -->
  <g transform="translate(895 263)">
    <rect class="lock" x="0" y="13" width="20" height="17" rx="3"/>
    <path class="lock" d="M4 13 V8 C4 3.6 7 1 10 1 C13 1 16 3.6 16 8 V13 H13 V8 C13 5.5 11.7 4 10 4 C8.3 4 7 5.5 7 8 V13 Z"/>
  </g>
  <g transform="translate(895 713)">
    <rect class="lock" x="0" y="13" width="20" height="17" rx="3"/>
    <path class="lock" d="M4 13 V8 C4 3.6 7 1 10 1 C13 1 16 3.6 16 8 V13 H13 V8 C13 5.5 11.7 4 10 4 C8.3 4 7 5.5 7 8 V13 Z"/>
  </g>

  <!-- Legend -->
  <rect x="464" y="1010" width="1110" height="78" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.3"/>
  <line x1="506" y1="1034" x2="540" y2="1034" stroke="#ea580c" stroke-width="2.9" stroke-linecap="round" marker-end="url(#arrowOrangeLegend)"/>
  <text class="legendText" x="562" y="1040">validated off-chain input</text>
  <line x1="946" y1="1034" x2="980" y2="1034" stroke="#16a34a" stroke-width="2.9" stroke-linecap="round" marker-end="url(#arrowGreenLegend)"/>
  <text class="legendText" x="1002" y="1040">research-use linkage</text>
  <line x1="506" y1="1064" x2="540" y2="1064" stroke="#7c3aed" stroke-width="3.0" stroke-linecap="round" marker-end="url(#arrowPurpleLegend)"/>
  <text class="legendText" x="562" y="1070">bounded consequence returned off-chain</text>
  <g transform="translate(948 1054) scale(.60)">
    <rect class="lock" x="0" y="13" width="20" height="17" rx="3"/>
    <path class="lock" d="M4 13 V8 C4 3.6 7 1 10 1 C13 1 16 3.6 16 8 V13 H13 V8 C13 5.5 11.7 4 10 4 C8.3 4 7 5.5 7 8 V13 Z"/>
  </g>
  <text class="legendText" x="972" y="1070">recognised state fixed on-chain</text>
  </g>
</svg>
